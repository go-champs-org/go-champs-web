name: Build new-staging Worker bundles

# Builds the two Worker payloads for new-staging.go-champs.com on Linux and
# publishes them as artifacts, so they can be deployed with `wrangler deploy`
# from anywhere.
#
# Why this exists: `opennextjs-cloudflare build` produces a broken bundle when
# run on Windows. OpenNext's copyTracedFiles reproduces pnpm's symlinks
# verbatim, and pnpm on Windows writes them as absolute paths into the store —
# so the bundler resolves Next from the workspace root, bypassing the copy that
# OpenNext patched, and every route 500s with
# `Dynamic require of "/.next/server/middleware-manifest.json"`. On Linux pnpm
# writes relative symlinks, which land inside the copied tree.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloudflare-new-staging

jobs:
  build_public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          # wrangler requires Node 22+; the rest of the monorepo pins 20.
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Worker bundle
        working-directory: apps/public
        env:
          NEXT_PUBLIC_CMS_URL: https://new-staging.go-champs.com
        run: npx opennextjs-cloudflare build
      - name: Report how pnpm linked next
        working-directory: apps/public
        run: |
          echo "source symlink:"
          readlink node_modules/next || echo "(not a symlink)"
          echo "copied symlink:"
          readlink .open-next/server-functions/default/apps/public/node_modules/next || echo "(not a symlink)"
          echo "getMiddlewareManifest in the emitted bundle:"
          grep -o "getMiddlewareManifest()[^}]\{0,60\}" \
            .open-next/server-functions/default/apps/public/handler.mjs | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: open-next-bundle
          path: apps/public/.open-next
          retention-days: 3
          include-hidden-files: true

  # The CMS is a CRA app, so its build has no symlink problem — it runs here
  # only because env.staging.js reads the staging credentials, which live as
  # repository secrets rather than on a workstation.
  build_cms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the CMS static assets
        env:
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          STAGING_RECAPTCHA_SITE_KEY: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}
          STAGING_SCOREBOARD_APP_URL: ${{ secrets.STAGING_SCOREBOARD_APP_URL }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          GA_ID: ${{ secrets.GA_ID }}
        run: pnpm --filter @gochamps/cms build:new-staging
      - uses: actions/upload-artifact@v4
        with:
          name: cms-build
          path: apps/cms/build
          retention-days: 3
