name: Deploy pre-prod Workers

# Builds and deploys the two Workers behind pre-prod.go-champs.com. Same
# topology as deploy-new-staging-workers.yml, but pointed at the real
# production API (PROD_API_HOST) instead of staging — actions taken in this
# environment's apps/cms mutate real production data. Manual dispatch only,
# never on push, so it never runs by accident.

on:
  workflow_dispatch:

concurrency:
  group: deploy-pre-prod-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy_public:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          # wrangler requires Node 22+; the rest of the monorepo pins 20.
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Worker bundle
        working-directory: apps/public
        env:
          NEXT_PUBLIC_CMS_URL: https://pre-prod.go-champs.com
          # wrangler.pre-prod.jsonc declares API_HOST too, but a var there only
          # exists inside the deployed Worker. Every page carrying `revalidate`
          # is prerendered here, during the build, and its fetches need the
          # host now.
          API_HOST: ${{ secrets.PROD_API_HOST }}
        run: npx opennextjs-cloudflare build -c wrangler.pre-prod.jsonc
      - uses: actions/upload-artifact@v4
        with:
          name: open-next-bundle-pre-prod
          path: apps/public/.open-next
          retention-days: 3
          include-hidden-files: true
      - name: Deploy
        working-directory: apps/public
        run: npx wrangler deploy -c wrangler.pre-prod.jsonc

  deploy_cms:
    # The CMS Worker declares a service binding to gochamps-public-pre-prod,
    # and deploying against a Worker that does not exist yet fails.
    needs: deploy_public
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify build secrets
        env:
          PROD_API_HOST: ${{ secrets.PROD_API_HOST }}
        run: |
          if [ -z "$PROD_API_HOST" ]; then
            echo "::error::PROD_API_HOST is missing - the build would produce an app without an API host"
            exit 1
          fi
      - name: Build the CMS static assets
        env:
          PROD_API_HOST: ${{ secrets.PROD_API_HOST }}
          PROD_RECAPTCHA_SITE_KEY: ${{ secrets.PROD_RECAPTCHA_SITE_KEY }}
          PROD_SCOREBOARD_APP_URL: ${{ secrets.PROD_SCOREBOARD_APP_URL }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          GA_ID: ${{ secrets.GA_ID }}
        run: pnpm --filter @gochamps/cms build:pre-prod
      - uses: actions/upload-artifact@v4
        with:
          name: cms-build-pre-prod
          path: apps/cms/build
          retention-days: 3
      - name: Deploy
        working-directory: apps/cms
        # Strips Netlify's _redirects, which Cloudflare parses natively and
        # rejects as an infinite loop.
        run: pnpm cf:deploy:pre-prod
