name: Main CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Keeps one master run at a time through the admin -> prod e2e -> prod chain:
# those are separate jobs, and with only job-level groups a second merge's
# deploy_admin could land between this run's deploy_admin and its prod e2e.
# The shared staging site is guarded by the job-level `staging-environment`
# group on deploy_staging_e2e, which PR runs (main.yml) queue on too.
concurrency:
  group: production-environment
  queue: max

jobs:
  lint_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          cache: 'pnpm'
      - name: Install dependencies
        # Only the e2e jobs run Cypress; skip its ~7s binary download elsewhere.
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile
      - name: Running lint
        run: pnpm lint:check
      - name: Validate SCSS color mapping
        run: pnpm --filter @gochamps/cms validate-colors

  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          cache: 'pnpm'
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile
      - name: Running test
        run: pnpm --filter @gochamps/cms test -- --watchAll=false

  build_public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          # apps/public declares engines >=20.9.0 and Next 16 enforces it, so
          # this job cannot ride the 20.0.0 the older jobs pin.
          node-version: '20.18.1'
          cache: 'pnpm'
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile
      # Jest runs through SWC and never checks types, so `next build` is the
      # only thing that type-checks apps/public. It needs no secrets: without
      # API_HOST the page loaders fall back to empty lists, which is the same
      # path a failing API takes in production.
      - name: Build public app
        run: pnpm --filter @gochamps/public build

  # The three CMS builds run at t=0 instead of inside the deploy jobs, so each
  # deploy only downloads its artifact.
  build_cms_staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          cache: 'pnpm'
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile
      - name: Verify build secrets
        env:
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
        run: |
          if [ -z "$STAGING_API_HOST" ]; then
            echo "::error::STAGING_API_HOST is missing - the build would produce an app without an API host"
            exit 1
          fi
      - name: Build Staging
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          STAGING_RECAPTCHA_SITE_KEY: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}
          STAGING_SCOREBOARD_APP_URL: ${{ secrets.STAGING_SCOREBOARD_APP_URL }}
        run: pnpm --filter @gochamps/cms build:staging
      - uses: actions/upload-artifact@v4
        with:
          name: cms-build-staging
          path: apps/cms/build
          retention-days: 1

  build_cms_admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          cache: 'pnpm'
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile
      - name: Verify build secrets
        env:
          PROD_API_HOST: ${{ secrets.PROD_API_HOST }}
        run: |
          if [ -z "$PROD_API_HOST" ]; then
            echo "::error::PROD_API_HOST is missing - the build would produce an app without an API host"
            exit 1
          fi
      - name: Build Prod
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          PROD_API_HOST: ${{ secrets.PROD_API_HOST }}
          PROD_RECAPTCHA_SITE_KEY: ${{ secrets.PROD_RECAPTCHA_SITE_KEY }}
          PROD_SCOREBOARD_APP_URL: ${{ secrets.PROD_SCOREBOARD_APP_URL }}
        run: pnpm --filter @gochamps/cms build
      - uses: actions/upload-artifact@v4
        with:
          name: cms-build-admin
          path: apps/cms/build
          retention-days: 1

  # Same build as build_cms_admin plus the analytics keys, which only the
  # production site gets.
  build_cms_prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          cache: 'pnpm'
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile
      - name: Verify build secrets
        env:
          PROD_API_HOST: ${{ secrets.PROD_API_HOST }}
        run: |
          if [ -z "$PROD_API_HOST" ]; then
            echo "::error::PROD_API_HOST is missing - the build would produce an app without an API host"
            exit 1
          fi
      - name: Build Prod
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FARO_URL: ${{ secrets.FARO_URL }}
          GA_ID: ${{ secrets.GA_ID }}
          PROD_API_HOST: ${{ secrets.PROD_API_HOST }}
          PROD_RECAPTCHA_SITE_KEY: ${{ secrets.PROD_RECAPTCHA_SITE_KEY }}
          PROD_SCOREBOARD_APP_URL: ${{ secrets.PROD_SCOREBOARD_APP_URL }}
        run: pnpm --filter @gochamps/cms build
      - uses: actions/upload-artifact@v4
        with:
          name: cms-build-prod
          path: apps/cms/build
          retention-days: 1

  # Deploy and e2e are one job so that the job-level concurrency group holds
  # both: as two jobs, a PR run's deploy could land between this run's deploy
  # and its e2e, and the e2e would test someone else's build.
  deploy_staging_e2e:
    needs:
      - unit_test
      - lint_check
      - build_cms_staging
    # Same group as main.yml: both deploy to the shared staging site before e2e.
    concurrency:
      group: staging-environment
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Cypress binary
        working-directory: apps/cms
        run: pnpm exec cypress install
      - uses: actions/download-artifact@v4
        with:
          name: cms-build-staging
          path: apps/cms/build
      - name: Verify Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH }}
          NETLIFY_SITE_ID: ${{ secrets.STAGING_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Netlify credentials are missing - the deploy would silently no-op"
            exit 1
          fi
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './apps/cms/build'
          production-branch: master
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH }}
          NETLIFY_SITE_ID: ${{ secrets.STAGING_SITE_ID }}
        timeout-minutes: 1
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: apps/cms
          start: echo "Using deployed staging environment"
          wait-on-timeout: 120
          record: false
          browser: chrome
          headed: false
        env:
          STAGING_APP_HOST: ${{ secrets.STAGING_APP_HOST }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          CYPRESS_baseUrl: ${{ secrets.STAGING_APP_HOST }}
          CYPRESS_E2E_TEST_KEY: ${{ secrets.E2E_TEST_KEY }}
          CYPRESS_defaultCommandTimeout: 15000
          CYPRESS_requestTimeout: 15000
          CYPRESS_responseTimeout: 15000
          CYPRESS_pageLoadTimeout: 30000
          CYPRESS_video: false
          CYPRESS_screenshotOnRunFailure: true
          CYPRESS_numTestsKeptInMemory: 0
          CYPRESS_retries: 2
      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots-staging
          path: |
            apps/cms/cypress/screenshots
            apps/cms/cypress/videos
          retention-days: 1

  deploy_admin:
    needs:
      - deploy_staging_e2e
      - build_cms_admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cms-build-admin
          path: apps/cms/build
      - name: Verify Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH }}
          NETLIFY_SITE_ID: ${{ secrets.ADMIN_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Netlify credentials are missing - the deploy would silently no-op"
            exit 1
          fi
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './apps/cms/build'
          production-branch: master
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH }}
          NETLIFY_SITE_ID: ${{ secrets.ADMIN_SITE_ID }}
        timeout-minutes: 1

  prod_e2e_test:
    needs: deploy_admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Cypress binary
        working-directory: apps/cms
        run: pnpm exec cypress install
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: apps/cms
          start: echo "Using deployed production environment"
          wait-on-timeout: 120
          record: false
          browser: chrome
          headed: false
        env:
          PROD_APP_HOST: ${{ secrets.PROD_APP_HOST }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          CYPRESS_baseUrl: ${{ secrets.PROD_APP_HOST }}
          CYPRESS_E2E_TEST_KEY: ${{ secrets.E2E_TEST_KEY }}
          CYPRESS_defaultCommandTimeout: 15000
          CYPRESS_requestTimeout: 15000
          CYPRESS_responseTimeout: 15000
          CYPRESS_pageLoadTimeout: 30000
          CYPRESS_video: false
          CYPRESS_screenshotOnRunFailure: true
          CYPRESS_numTestsKeptInMemory: 0
          CYPRESS_retries: 2
      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots-production
          path: |
            apps/cms/cypress/screenshots
            apps/cms/cypress/videos
          retention-days: 1

  deploy_prod:
    needs:
      - prod_e2e_test
      - build_cms_prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cms-build-prod
          path: apps/cms/build
      - name: Verify Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH }}
          NETLIFY_SITE_ID: ${{ secrets.PROD_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Netlify credentials are missing - the deploy would silently no-op"
            exit 1
          fi
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './apps/cms/build'
          production-branch: master
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH }}
          NETLIFY_SITE_ID: ${{ secrets.PROD_SITE_ID }}
        timeout-minutes: 1
